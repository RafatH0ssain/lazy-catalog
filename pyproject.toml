[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lazy-catalog"
version = "0.1.0"
description = "Catalogue a local film and TV library into Markdown and a browsable page"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
lazy-catalog = "lazycatalog.cli:main"

[tool.setuptools.packages.find]
include = ["lazycatalog*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
check_untyped_defs = true
